userName: YOUR_USERNAME
accessKey: YOUR_ACCESS_KEY

projectName: YOUR_PROJECT_NAME
buildName: browserstack build
buildIdentifier: '#${BUILD_NUMBER}'
buildTag: "regresson"
selfHeal: true

platforms: []
parallelsPerPlatform: 2
framework: cucumber-testng #junit,testng,java,cucumber-testng,serenity,cucumber-junit
source: cucumber-testng:intellij:v1.1.2
staticWebDriver: true
browserstackAutomation: false


browserstackLocal: false
debug: true 
networkLogs: true 
consoleLogs: errors 


testObservability: true
accessibility: true
accessibilityOptions:
  wcagVersion: wcag21aaa 
  includeIssueType:
    bestPractice: true 
    needsReview: true 
    experimental: true 


performance: assert
percy: true
percyCaptureMode: auto
browserProfiling: true


testOrchestrationOptions:
  retryTestsOnFailure:
    enabled: true
    maxRetries: 2
  runSmartSelection:
    enabled: true
    mode: relevantFirst
  runPreviouslyFailedFirst: true
